version: 2

sources:
  - name: raw
    database: "LOCAL_DBT_INGESTION"
    schema: "PUBLIC"
    tables:
      - name: raw_customers
        description: Customers loaded from CSV via Snowflake user stage.
        columns:
          - name: id
            description: Primary key.
          - name: name
            description: Full name.
          - name: email
            description: Email address.
          - name: created_at
            description: Account creation timestamp (UTC).
